name: Feature request
description: Suggest an improvement for VectorBridge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short summary of the feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The problem you are solving.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you think this could be implemented.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have considered.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklists
      options:
        - label: I have searched existing discussions.
        - label: I have checked the README for existing limitations.
