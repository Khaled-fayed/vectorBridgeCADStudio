<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Dark Slate Blueprint Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cyan-to-Blue CAD Accent Gradient -->
    <linearGradient id="cadAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- PDF Crimson Accent -->
    <linearGradient id="pdfAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- App Icon Rounded Square Base -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="3" />

  <!-- Subtle CAD Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.45">
    <line x1="64" y1="24" x2="64" y2="232" />
    <line x1="128" y1="24" x2="128" y2="232" />
    <line x1="192" y1="24" x2="192" y2="232" />
    <line x1="24" y1="64" x2="232" y2="64" />
    <line x1="24" y1="128" x2="232" y2="128" />
    <line x1="24" y1="192" x2="232" y2="192" />
  </g>

  <!-- Left Side: Stylized PDF Document Frame -->
  <path d="M 56 68 L 106 68 L 122 84 L 122 188 L 56 188 Z" fill="none" stroke="url(#pdfAccent)" stroke-width="6" stroke-linejoin="round" />
  <!-- Document Folded Corner -->
  <polyline points="106,68 106,84 122,84" fill="none" stroke="url(#pdfAccent)" stroke-width="5" stroke-linejoin="round" />

  <!-- Bridge / Geometric Vector Arc Connecting PDF to CAD -->
  <path d="M 88 148 A 52 52 0 0 1 184 104" fill="none" stroke="url(#cadAccent)" stroke-width="7" stroke-linecap="round" />

  <!-- Right Side: CAD Crosshair & Geometric Construction Lines -->
  <line x1="136" y1="176" x2="204" y2="176" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <line x1="184" y1="84" x2="184" y2="196" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  
  <!-- Dashed Projection Line -->
  <line x1="88" y1="148" x2="184" y2="176" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6,6" />

  <!-- CAD Vertex / Grip Snap Nodes -->
  <rect x="82" y="142" width="12" height="12" fill="#0F172A" stroke="#F43F5E" stroke-width="3.5" />
  <rect x="178" y="98" width="12" height="12" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5" />
  <rect x="178" y="170" width="12" height="12" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5" />
</svg>